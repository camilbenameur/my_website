<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Camil Benameur, software engineer">
  <!-- Open Graph card, art direction V1 "Terminal": one terminal window, two ghosts, no photo.
       Text uses Geist and JetBrains Mono (see the font stacks); public/og-image.png is rendered from this file with the fonts loaded. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#7BE0A4" stop-opacity=".10"/>
      <stop offset="1" stop-color="#7BE0A4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0B0D11"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- ghost windows -->
  <g fill="#12151B" stroke="#343C4B">
    <g opacity=".48"><rect x="132.500" y="64.500" width="1040" height="450" rx="12"/><path d="M133 101h1039" stroke="#252B36"/></g>
    <g opacity=".78"><rect x="106.500" y="82.500" width="1040" height="450" rx="12"/><path d="M107 119h1039" stroke="#252B36"/></g>
  </g>

  <!-- terminal window -->
  <g filter="url(#shadow)">
    <rect x="80.500" y="100.500" width="1040" height="450" rx="12" fill="#12151B" stroke="#252B36"/>
  </g>
  <clipPath id="win"><rect x="80.500" y="100.500" width="1040" height="450" rx="12"/></clipPath>
  <g clip-path="url(#win)">
    <rect x="80" y="100" width="1041" height="40" fill="#171B22"/>
    <path d="M80 140.500h1041" stroke="#252B36"/>
    <rect x="80" y="500" width="1041" height="51" fill="#171B22"/>
    <path d="M80 500.500h1041" stroke="#252B36"/>
  </g>
  <rect x="80.500" y="100.500" width="1040" height="450" rx="12" fill="none" stroke="#252B36"/>
  <g fill="#6B7485" opacity=".55"><circle cx="104" cy="120" r="4.500"/><circle cx="120" cy="120" r="4.500"/><circle cx="136" cy="120" r="4.500"/></g>
  <text x="164" y="124.500" font-family="'JetBrains Mono Variable','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="500" letter-spacing=".28" fill="#8C95A5">camil -- bash</text>

  <g font-family="'JetBrains Mono Variable','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="20">
    <text x="116" y="188"><tspan fill="#7BE0A4" font-weight="500">camil@lyon</tspan><tspan fill="#8C95A5">:~</tspan><tspan fill="#B4BBC8">$</tspan><tspan fill="#E7E9EE"> whoami</tspan></text>
    <text x="116" y="468"><tspan fill="#7BE0A4" font-weight="500">camil@lyon</tspan><tspan fill="#8C95A5">:~</tspan><tspan fill="#B4BBC8">$</tspan></text>
    <rect x="284" y="450" width="12" height="24" fill="#7BE0A4"/>
    <text x="116" y="531" font-size="20" fill="#B4BBC8">camilbenameur.com</text>
  </g>

  <g font-family="'Geist Variable','Geist Fallback',Geist,ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif">
    <text x="112" y="304" font-size="120" font-weight="600" letter-spacing="-4.200" fill="#E7E9EE">Camil Benameur</text>
    <text x="115" y="366" font-size="34" font-weight="400" letter-spacing="-.170" fill="#E7E9EE">I'm a software engineer. I've built an offline installer for</text>
    <text x="115" y="414" font-size="34" font-weight="400" letter-spacing="-.170" fill="#E7E9EE">industrial PCs and a Go library for streamed LLM JSON.</text>
  </g>
</svg>
